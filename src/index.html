<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Grupo Nehoraj - Transformación Digital & Innovación Tecnológica</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Transformamos tu negocio con soluciones tecnológicas personalizadas, combinando inteligencia artificial, desarrollo de software a medida y aplicaciones innovadoras.">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Grupo Nehoraj">
  <meta property="og:title" content="Grupo Nehoraj - Transformación Digital & Innovación Tecnológica">
  <meta property="og:description" content="Transformamos tu negocio con soluciones tecnológicas personalizadas, combinando inteligencia artificial, desarrollo de software a medida y aplicaciones innovadoras.">
  <meta property="og:image" content="https://nehoraj.com/assets/images/og-default.jpg">
  <meta property="og:url" content="https://nehoraj.com/">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Grupo Nehoraj - Transformación Digital & Innovación Tecnológica">
  <meta name="twitter:description" content="Transformamos tu negocio con soluciones tecnológicas personalizadas, combinando inteligencia artificial, desarrollo de software a medida y aplicaciones innovadoras.">
  <meta name="twitter:image" content="https://nehoraj.com/assets/images/og-default.jpg">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!--
    Estilos de la pantalla de carga inline (no en styles.scss): tienen que
    pintarse en el primer byte, antes de que llegue la hoja de estilos
    externa. Es justo el hueco que ocupaba el blanco por defecto de Angular.
  -->
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #f8fafc;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #app-loader.app-loader--hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .app-loader__mark {
      position: relative;
      width: 64px;
      height: 64px;
    }
    .app-loader__mark svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.35);
    }
    .app-loader__ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 3px solid rgba(37, 99, 235, 0.15);
      border-top-color: #2563eb;
      animation: app-loader-spin 0.9s linear infinite;
    }
    .app-loader__text {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.02em;
      color: #475569;
    }
    @keyframes app-loader-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .app-loader__ring { animation: none; }
    }
  </style>
</head>
<body>
  <!--
    Pantalla de carga de marca: sustituye el blanco por defecto de Angular
    mientras el bundle del cliente descarga e hidrata. main.ts la retira
    (fade + remove) en cuanto bootstrapApplication resuelve.
  -->
  <div id="app-loader" role="status" aria-live="polite" aria-label="Cargando Grupo Nehoraj">
    <div class="app-loader__mark">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="app-loader-g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#0ea5e9"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="14" fill="url(#app-loader-g)"/>
        <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
              font-family="Arial, Helvetica, sans-serif" font-weight="800"
              font-size="34" fill="#ffffff">N</text>
      </svg>
      <span class="app-loader__ring"></span>
    </div>
    <span class="app-loader__text">Grupo Nehoraj</span>
  </div>

  <app-root></app-root>
</body>
</html>
